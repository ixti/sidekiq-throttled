name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: "test / ${{ matrix.ruby }} / ${{ matrix.redis }}"

    runs-on: ubuntu-latest

    services:
      redis:
        image: ${{ matrix.redis }}
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        ruby: [ ruby-3.2, ruby-3.3, ruby-3.4, ruby-4.0 ]
        redis: [ "redis:7.0", "redis:7.2" ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1
        env:
          BUNDLE_GEMS__CONTRIBSYS__COM: ${{ secrets.BUNDLE_GEMS__CONTRIBSYS__COM }}
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run test suites
        env:
          BUNDLE_GEMS__CONTRIBSYS__COM: ${{ secrets.BUNDLE_GEMS__CONTRIBSYS__COM }}
        run: bundle exec rake test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1

  # See: https://github.com/orgs/community/discussions/26822#discussioncomment-3305794
  test-finale:
    name: "test"

    runs-on: ubuntu-latest
    if: ${{ always() }}

    needs: [test]

    steps:
      - run: test "success" = "${{ needs.test.result }}"

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1
        with:
          ruby-version: ruby-3.2
          bundler-cache: true

      - run: bundle exec rake lint
